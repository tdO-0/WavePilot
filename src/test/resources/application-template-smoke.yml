# Template-smoke profile: real MATLAB candidate smoke tests. Requires a real
# MATLAB_EXECUTABLE; never part of the default run.
wavepilot:
  enabled: true
  template:
    smoke:
      runner: local-matlab
      timeout: 60s
  runner:
    type: mock
  artifacts:
    root: smoke-artifacts/template-smoke
  knowledge:
    repository: memory
spring:
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
