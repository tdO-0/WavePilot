server:
  port: ${SERVER_PORT:9900}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      # Explicit common tag: Main excludes parts of the actuator auto-configuration,
      # so the automatic application-name tag cannot be relied on.
      application: ${spring.application.name:wavepilot}

file:
  upload:
    path: ./uploads
    allowed-extensions: txt,md
    max-size-bytes: 5242880

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:9900}

milvus:
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}
  username: ""
  password: ""
  database: default
  timeout: 10000

# Spring AI Alibaba DashScope 配置
spring:
  # Appears as the application label in Prometheus metrics.
  application:
    name: wavepilot
  datasource:
    url: ${WAVEPILOT_MYSQL_URL:jdbc:mysql://localhost:3306/wavepilot?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${WAVEPILOT_MYSQL_USER:wavepilot}
    password: ${WAVEPILOT_MYSQL_PASSWORD:wavepilot-dev-only}
  rabbitmq:
    host: ${WAVEPILOT_RABBIT_HOST:localhost}
    port: ${WAVEPILOT_RABBIT_PORT:5672}
    username: ${WAVEPILOT_RABBIT_USER:wavepilot}
    password: ${WAVEPILOT_RABBIT_PASSWORD:wavepilot-dev-only}
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:not-configured}
      chat:
        options:
          model: ${wavepilot.ai.chat-model}
          timeout: 180000  # 超时时间180秒（3分钟）
      embedding:
        enabled: true
        options:
          model: ${wavepilot.ai.embedding-model}
      retry:
        max-attempts: 3  # 最大重试次数
        backoff:
          initial-interval: 2000  # 初始重试间隔2秒
          multiplier: 2  # 重试间隔倍数
          max-interval: 10000  # 最大重试间隔10秒

# 文档分片配置
document:
  chunk:
    max-size: 800  # 每个分片最大字符数
    overlap: 100   # 分片之间的重叠字符数

# WavePilot keeps Mock as the safe default. Set WAVEPILOT_RUNNER_TYPE=local-matlab
# only on a host with a trusted MATLAB executable. MCP MATLAB is not implemented.
wavepilot:
  enabled: true
  node-role: ${WAVEPILOT_NODE_ROLE:standalone}
  # Keep the older jobs.persistence setting working; new setting takes precedence.
  job-repository: ${WAVEPILOT_JOB_REPOSITORY:${wavepilot.jobs.persistence:in-memory}}
  ai:
    chat-model: "qwen3.7-max"
    embedding-model: "qwen3.7-text-embedding"
    timeout-millis: 180000
  runner:
    type: ${WAVEPILOT_RUNNER_TYPE:mock}
    local-matlab:
      executable: "${MATLAB_EXECUTABLE:matlab}"
      template: ${WAVEPILOT_MATLAB_TEMPLATE:polar-k-identification-simple-v1}
      timeout: ${WAVEPILOT_MATLAB_TIMEOUT:10m}
      poll-interval: ${WAVEPILOT_MATLAB_POLL_INTERVAL:200ms}
      shutdown-grace: ${WAVEPILOT_MATLAB_SHUTDOWN_GRACE:5s}
  artifacts:
    root: "${WAVEPILOT_ARTIFACT_ROOT:artifacts}"
    shared-metadata: ${WAVEPILOT_SHARED_ARTIFACT_METADATA:false}
  outbox:
    relay-enabled: ${WAVEPILOT_OUTBOX_RELAY_ENABLED:true}
    relay-interval-ms: ${WAVEPILOT_OUTBOX_RELAY_INTERVAL_MS:1000}
    batch-size: ${WAVEPILOT_OUTBOX_BATCH_SIZE:50}
    claim-lease: ${WAVEPILOT_OUTBOX_CLAIM_LEASE:60s}
    backoff-base: ${WAVEPILOT_OUTBOX_BACKOFF_BASE:1s}
    backoff-cap: ${WAVEPILOT_OUTBOX_BACKOFF_CAP:300s}
  lease:
    enabled: ${WAVEPILOT_LEASE_ENABLED:true}
    duration: ${WAVEPILOT_LEASE_DURATION:60s}
    heartbeat-interval-ms: ${WAVEPILOT_LEASE_HEARTBEAT_INTERVAL_MS:15000}
    scan-interval-ms: ${WAVEPILOT_LEASE_SCAN_INTERVAL_MS:10000}
    scan-batch: ${WAVEPILOT_LEASE_SCAN_BATCH:100}
    scan-grace: ${WAVEPILOT_LEASE_SCAN_GRACE:5s}
    safe-requeue-runner-types: ${WAVEPILOT_LEASE_SAFE_REQUEUE_RUNNER_TYPES:mock}
  metrics:
    status-sync-interval-ms: ${WAVEPILOT_STATUS_SYNC_INTERVAL_MS:30000}
  replay:
    numeric-tolerance: 1.0e-9
  knowledge:
    repository: ${WAVEPILOT_KNOWLEDGE_REPOSITORY:milvus}
    collection: wavepilot_knowledge_v1
    hybrid:
      dense-candidate-k: ${WAVEPILOT_DENSE_CANDIDATE_K:20}
      sparse-candidate-k: ${WAVEPILOT_SPARSE_CANDIDATE_K:20}
      result-top-k: ${WAVEPILOT_HYBRID_TOP_K:5}
      rrf-k: ${WAVEPILOT_RRF_K:60}
      routing-boost: ${WAVEPILOT_ROUTING_BOOST:1.08}
      reranker: ${WAVEPILOT_RERANKER:deterministic}
      model-reranker-enabled: ${WAVEPILOT_MODEL_RERANKER_ENABLED:false}
  embedding:
    # true = deterministic offline vectors (no DashScope); for offline demos/tests only
    offline: ${WAVEPILOT_EMBEDDING_OFFLINE:false}
  evaluation:
    # wait limit for Job/Replay eval cases; raise it for a real MATLAB runner (minutes)
    job-wait-timeout-millis: ${WAVEPILOT_EVAL_JOB_WAIT_MILLIS:10000}
  scientific:
    run-store: ${WAVEPILOT_AGENT_RUN_STORE:data/wavepilot/agent-runs}
    execution-ledger-store: ${WAVEPILOT_EXECUTION_LEDGER_STORE:data/wavepilot/execution-ledger}
    planner-mode: ${WAVEPILOT_SCIENTIFIC_PLANNER_MODE:deterministic}
    replanner-mode: ${WAVEPILOT_SCIENTIFIC_REPLANNER_MODE:deterministic}
  spec:
    default-random-seed: 20
